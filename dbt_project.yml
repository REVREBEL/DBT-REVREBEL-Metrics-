
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'revrebel_metrics'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'BigQuery'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

# Asset and Skill paths for AI agents (dbt-agent-skills)
asset-paths: ["assets"]
# Custom key for agent skills if using dbt-mcp or Claude Code
# skills-paths: ["skills"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------
# Project Variables
# ---------------------------------------------------------------
vars:
  # This serves as the fallback for ALL resources, including semantic models.
  # Using vars avoids the strict "struct" validation errors in Fusion.

  # dbt_project.yml
  # Global fallback for all model and semantic model naming
  dbt_osmosis_default_path: "_{model}.yml"
  dbt-osmosis:
    # Directory overrides can go here
    staging_path: "{parent}.yml"
    yaml_settings:
      width: 120
      preserve_quotes: true
    # Exclude system columns to keep documentation clean
    column_ignore_patterns:
      - "_FIVETRAN_SYNCED"
      - "_PARTITIONTIME"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run 
# dbt run or dbt build, all of your models will be built as a view in your data platform. 
# The configuration below will override this setting for models in the example folder to 
# instead be materialized as tables. Any models you add to the root of the models folder will 
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

# ---------------------------------------------------------------
# Model Configurations (Partitioning & Searchability)
# ---------------------------------------------------------------
models:
  revrebel_metrics:
    staging:
      +materialized: view
      +location: "us-central1"
      +meta:
        copy_dataset_tags: false

# ---------------------------------------------------------------
# Fusion Engine Specifics: Cost & Metadata Labeling
# ---------------------------------------------------------------
# Enables query labels to track costs of BigQuery wide table scans
semantic-models:
  revrebel_metrics:
    # Remove the +dbt-osmosis line from here. 
    # Fusion expects this to be a dictionary of SPEC-VALID keys only.
    # dbt-osmosis will automatically use the global var set above.
    +enabled: true

# ---------------------------------------------------------------
# Fusion Engine Specifics: Cost & Metadata Labeling
# ---------------------------------------------------------------
# Enables query labels to track costs of BigQuery wide table scans
query-comment:
  comment: '{{ "dbt-" ~ dbt_version ~ "-" ~ model.name if model else "dbt-internal" }}'
  job-label: true
